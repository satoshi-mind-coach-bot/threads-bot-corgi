name: Threads Auto Post

on:
  schedule:
    # JST 9:00 = UTC 0:00
    - cron: '0 0 * * *'
    # JST 11:00 = UTC 2:00
    - cron: '0 2 * * *'
    # JST 13:00 = UTC 4:00
    - cron: '0 4 * * *'
    # JST 19:00 = UTC 10:00
    - cron: '0 10 * * *'
    # JST 21:00 = UTC 12:00
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Post to Threads
        env:
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python agents/poster.py

      - name: Save updated queue and history
        run: |
          git config user.email "bot@threads-bot"
          git config user.name "ThreadsBot"
          git add data/
          git diff --staged --quiet || git commit -m "Update queue and history"
          git push
